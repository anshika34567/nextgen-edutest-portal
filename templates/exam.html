<!DOCTYPE html>
<html>

<head>

<title>Online Exam</title>

{% load static %}

<link rel="stylesheet" href="{% static 'css/style.css' %}">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="dashboard-box">

<h2>Online Exam</h2>

<hr>
<div style="text-align:right; font-size:18px; margin-bottom:15px;">
Time Left: <span id="timer">60</span> seconds
</div>
<form method="POST">

{% csrf_token %}
{% for q in questions %}

<div class="card p-3 mb-3">

<h5>{{ q.question_text }}</h5>

<div>
<input type="radio" name="{{ q.id }}" value="{{ q.option1 }}"> {{ q.option1 }} <br>
<input type="radio" name="{{ q.id }}" value="{{ q.option2 }}"> {{ q.option2 }} <br>
<input type="radio" name="{{ q.id }}" value="{{ q.option3 }}"> {{ q.option3 }} <br>
<input type="radio" name="{{ q.id }}" value="{{ q.option4 }}"> {{ q.option4 }} <br>
</div>

</div>

{% endfor %}

<button class="btn btn-success">Submit Exam</button>


</form>

</div>
<script>

let timeLeft = 60;   // seconds

let timer = setInterval(function(){

timeLeft--;

document.getElementById("timer").innerText = timeLeft;

if(timeLeft <= 0){

clearInterval(timer);

alert("Time is up! Exam submitted.");

document.forms[0].submit();

}

},1000);

</script>
</body>

</html>
