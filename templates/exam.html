<!DOCTYPE html>
<html>
<head>
    <title>Online Exam</title>

    {% load static %}

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand">NextGen EduTest Portal</a>
    </div>
</nav>


<body>
<body>

{% include 'navbar.html' %}

<div class="dashboard-box">

    <h2>{{ exam.title }}</h2>
    <hr>

    <div style="text-align:right; font-size:18px; margin-bottom:15px;">
        ⏱ Time Remaining:
        <span id="timer" style="font-weight:bold;color:red;">01:00</span>
    </div>

    <form method="POST" id="examForm">

        {% csrf_token %}

        {% for q in questions %}

        <div class="card p-3 mb-3">

            <h5>{{ q.question_text }}</h5>

            <div>
                <input type="radio" name="q{{ q.id }}" value="{{ q.option1 }}"> {{ q.option1 }} <br>
                <input type="radio" name="q{{ q.id }}" value="{{ q.option2 }}"> {{ q.option2 }} <br>
                <input type="radio" name="q{{ q.id }}" value="{{ q.option3 }}"> {{ q.option3 }} <br>
                <input type="radio" name="q{{ q.id }}" value="{{ q.option4 }}"> {{ q.option4 }} <br>
            </div> 

        </div>

        {% endfor %}

        <button type="submit" class="btn btn-success">
            Submit Exam
        </button>

    </form>

</div>

<!-- TIMER SCRIPT -->

<script>
// Request Fullscreen when exam starts
window.onload = function() {
    document.documentElement.requestFullscreen();
};

let time = 60; // Change to 600 for 10 mins

let timer = setInterval(function(){

    let minutes = Math.floor(time / 60);
    let seconds = time % 60;

    seconds = seconds < 10 ? "0" + seconds : seconds;

    document.getElementById("timer").innerHTML =
        minutes + ":" + seconds;

    if(time <= 0){

        clearInterval(timer);

        alert("Time is up! Exam submitted automatically.");

        document.getElementById("examForm").submit();

        return;
    }

    time--;

},1000);

</script>

<!-- TAB SWITCH DETECTION -->

<script>

document.addEventListener("visibilitychange", function() {

    if (document.hidden) {

        alert("Tab switching detected! Exam submitted.");

        document.getElementById("examForm").submit();
    }
});

</script>

<!-- DISABLE RIGHT CLICK -->

<script>

document.addEventListener("contextmenu", function(e){
    e.preventDefault();
});

</script>

<!-- WARNING BEFORE LEAVING PAGE -->

<script>

window.onbeforeunload = function() {
    return "Exam is running. Are you sure you want to leave?";
};

</script>

</body>
</html>
