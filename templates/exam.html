<!DOCTYPE html>
<html>

<head>

<title>Online Exam</title>

{% load static %}

<link rel="stylesheet" href="{% static 'css/style.css' %}">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="dashboard-box">

<h2>Online Exam</h2>

<hr>
<div style="text-align:right; font-size:18px; margin-bottom:15px;">
⏱ Time Remaining:<span id="timer">10:00</span>minutes
</div>
<form method="POST">

{% csrf_token %}
{% for q in questions %}

<div class="card p-3 mb-3">

<h5>{{ q.question_text }}</h5>

<div>
<input type="radio" name="{{ q.id }}" value="{{ q.option1 }}"> {{ q.option1 }} <br>
<input type="radio" name="{{ q.id }}" value="{{ q.option2 }}"> {{ q.option2 }} <br>
<input type="radio" name="{{ q.id }}" value="{{ q.option3 }}"> {{ q.option3 }} <br>
<input type="radio" name="{{ q.id }}" value="{{ q.option4 }}"> {{ q.option4 }} <br>
</div>

</div>

{% endfor %}

<button class="btn btn-success">Submit Exam</button>


</form>

</div>
<script>
let time = 600; // 10 minutes in seconds

let timer = setInterval(function(){

let minutes = Math.floor(time / 60);
let seconds = time % 60;

seconds = seconds < 10 ? "0" + seconds : seconds;

document.getElementById("timer").innerHTML =
minutes + ":" + seconds;

time--;

if(time < 0){

clearInterval(timer);

alert("Time is up! Exam submitted automatically.");
document.forms[0].submit();
}
},1000);
</script>
<script>
window.onbeforeunload = function() {
return "Exam is running. Are you sure you want to leave?";
};
</script>
</body>
</html>
