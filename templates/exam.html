```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Exam</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(
        135deg,
        #0f172a,
        #1e3a8a,
        #312e81
    );
    color:white;
}

.navbar{
    background:rgba(0,0,0,0.3)!important;
    backdrop-filter:blur(10px);
}

.exam-container{
    max-width:1000px;
    margin:30px auto;
    padding:20px;
}

.exam-header{
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(15px);
    border-radius:20px;
    padding:20px;
    margin-bottom:25px;
}

.timer-box{
    background:#dc2626;
    color:white;
    padding:10px 20px;
    border-radius:12px;
    font-weight:bold;
    display:inline-block;
}

.question-card{
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(15px);
    border-radius:20px;
    padding:25px;
    margin-bottom:20px;
}

.question-card h5{
    margin-bottom:20px;
}

.option{
    background:rgba(255,255,255,0.08);
    padding:12px;
    border-radius:10px;
    margin-bottom:10px;
}

.option:hover{
    background:rgba(255,255,255,0.15);
}

.submit-btn{
    width:100%;
    padding:15px;
    font-size:18px;
    border:none;
    border-radius:12px;
    background:#16a34a;
    color:white;
}

.submit-btn:hover{
    background:#15803d;
}

</style>

</head>
<body>

<nav class="navbar navbar-dark">
<div class="container-fluid">
<a class="navbar-brand fw-bold">
🎓 EduTest Portal
</a>
</div>
</nav>

<div class="exam-container">

<div class="exam-header">

<h2>{{ exam.title }}</h2>

<p>
Subject: {{ exam.subject }}
</p>

<div class="timer-box">
⏱ Time Remaining:
<span id="timer">01:00</span>
</div>

</div>

<form method="POST" id="examForm">

{% csrf_token %}

{% for q in questions %}

<div class="question-card">

<h5>
Q{{ forloop.counter }}.
{{ q.question_text }}
</h5>

<label class="option d-block">
<input type="radio" name="q{{ q.id }}" value="{{ q.option1 }}">
{{ q.option1 }}
</label>

<label class="option d-block">
<input type="radio" name="q{{ q.id }}" value="{{ q.option2 }}">
{{ q.option2 }}
</label>

<label class="option d-block">
<input type="radio" name="q{{ q.id }}" value="{{ q.option3 }}">
{{ q.option3 }}
</label>

<label class="option d-block">
<input type="radio" name="q{{ q.id }}" value="{{ q.option4 }}">
{{ q.option4 }}
</label>

</div>

{% endfor %}

<button type="submit" class="submit-btn">
Submit Exam
</button>

</form>

</div>

<script>

window.onload = function() {
    document.documentElement.requestFullscreen();
};

let time = 60;

let timer = setInterval(function(){

    let minutes = Math.floor(time/60);
    let seconds = time%60;

    seconds = seconds < 10 ? "0"+seconds : seconds;

    document.getElementById("timer").innerHTML =
        minutes + ":" + seconds;

    if(time <= 0){

        clearInterval(timer);

        alert("Time is up! Exam submitted.");

        document.getElementById("examForm").submit();

        return;
    }

    time--;

},1000);

document.addEventListener("visibilitychange", function(){

    if(document.hidden){

        alert("Tab switching detected. Exam submitted.");

        document.getElementById("examForm").submit();
    }
});

document.addEventListener("contextmenu", function(e){
    e.preventDefault();
});

window.onbeforeunload = function(){
    return "Exam is running.";
};

</script>

</body>
</html>
```
