<!DOCTYPE html>
<html lang="en">
<head>
    <title>Student Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

    body{
        margin:0;
        font-family:'Segoe UI',sans-serif;
        min-height:100vh;

        background:linear-gradient(
            135deg,
            #0f172a,
            #1e3a8a,
            #312e81
        );

        color:white;
    }

    .navbar{
        background:rgba(0,0,0,0.3)!important;
        backdrop-filter:blur(10px);
        padding:15px 30px;
    }

    .register-section{
        min-height:90vh;
        display:flex;
        justify-content:center;
        align-items:center;
    }

    .register-card{
        width:450px;

        background:rgba(255,255,255,0.1);

        backdrop-filter:blur(15px);

        border-radius:20px;

        padding:40px;

        box-shadow:0 8px 30px rgba(0,0,0,0.3);
    }

    .register-card h2{
        text-align:center;
        margin-bottom:25px;
        font-weight:700;
    }

    .form-control{
        padding:12px;
        border-radius:10px;
        border:none;
        margin-bottom:15px;
    }

    .btn-register{
        width:100%;

        background:#2563eb;
        border:none;

        padding:12px;

        border-radius:10px;

        color:white;
        font-size:18px;
    }

    .btn-register:hover{
        background:#1d4ed8;
    }

    .login-link{
        text-align:center;
        margin-top:20px;
    }

    .login-link a{
        color:#60a5fa;
        text-decoration:none;
    }

    .footer{
        text-align:center;
        color:#cbd5e1;
        padding:20px;
    }

    </style>

</head>
<body>

<nav class="navbar navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold">
            🎓 EduTest Portal
        </a>
    </div>
</nav>

<section class="register-section">

    <div class="register-card">

        <h2>Student Registration</h2>

        <form method="POST">
            {% csrf_token %}

            <input type="text"
                   name="name"
                   class="form-control"
                   placeholder="Full Name"
                   required>

            <input type="email"
                   name="email"
                   class="form-control"
                   placeholder="Email Address"
                   required>

            <input type="password"
                   name="password"
                   class="form-control"
                   placeholder="Password"
                   required>

            <input type="text"
                   name="course"
                   class="form-control"
                   placeholder="Course">

            <button type="submit" class="btn-register">
                Register
            </button>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="/login/">Login</a>
        </div>

    </div>

</section>

<footer class="footer">
    © 2026 EduTest Portal | Final Year Project
</footer>

</body>
</html>
