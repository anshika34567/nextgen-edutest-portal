<!DOCTYPE html>
<html>

<head>

<title>Register</title>

{% load static %}

<link rel="stylesheet" href="{% static 'css/style.css' %}">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>
<nav class="navbar navbar-dark bg-dark">
<div class="container-fluid">
<a class="navbar-brand">NextGen EduTest Portal</a>
</div>
</nav>

<div class="card-box">

<h3 class="text-center mb-4">Student Registration</h3>

<form method="POST">

{% csrf_token %}

<input type="text" name="name" class="form-control mb-3" placeholder="Name" required>

<input type="email" name="email" class="form-control mb-3" placeholder="Email" required>

<input type="password" name="password" class="form-control mb-3" placeholder="Password" required>

<input type="text" name="course" class="form-control mb-3" placeholder="Course">
<button class="btn btn-primary btn-main">Register</button>
</form>
<p class="text-center mt-3">
Already have an account? <a href="/login">Login</a>
</p>
</div>
<div class="footer" style="text-align: center; position: fixed; bottom: 0; width: 100%; padding: 10px; background-color: #f8f9fa;">
NextGen EduTest Portal © 2026
</div>
</body>
</html>
