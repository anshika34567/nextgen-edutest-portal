
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(
        135deg,
        #0f172a,
        #1e3a8a,
        #312e81
    );
    color:white;
}

.navbar{
    background:rgba(0,0,0,0.3)!important;
    backdrop-filter:blur(10px);
}

.dashboard-container{
    max-width:1200px;
    margin:40px auto;
    padding:20px;
}

.stat-card{
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(15px);
    border-radius:20px;
    padding:25px;
    text-align:center;
    margin-bottom:20px;
}

.stat-card h2{
    font-size:40px;
    font-weight:bold;
}

.chart-card{
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(15px);
    border-radius:20px;
    padding:25px;
    margin-top:25px;
}

.quick-links a{
    margin:5px;
}

</style>
</head>

<body>

<nav class="navbar navbar-dark">
<div class="container-fluid">
<a class="navbar-brand fw-bold">
🎓 EduTest Admin Dashboard
</a>
<a href="/admin/" class="btn btn-danger" align="left">
Django Admin
</a>
</div>
</nav>

<div class="dashboard-container">

<h2 class="text-center mb-4">
📊 System Analytics
</h2>

<div class="row">

<div class="col-md-4">
<div class="stat-card">
<h2>{{ total_students }}</h2>
<p>Total Students</p>
</div>
</div>

<div class="col-md-4">
<div class="stat-card">
<h2>{{ total_exams }}</h2>
<p>Total Exams</p>
</div>
</div>

<div class="col-md-4">
<div class="stat-card">
<h2>{{ total_questions }}</h2>
<p>Total Questions</p>
</div>
</div>

<div class="col-md-6">
<div class="stat-card">
<h2>{{ total_results }}</h2>
<p>Total Exam Attempts</p>
</div>
</div>

<div class="col-md-6">
<div class="stat-card">
<h2>{{ cheating_cases }}</h2>
<p>Cheating Reports</p>
</div>
</div>

</div>

<div class="chart-card">

<h3 class="text-center mb-4">
📈 Analytics Overview
</h3>

<canvas id="analyticsChart"></canvas>

</div>



</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

new Chart(
document.getElementById('analyticsChart'),
{
type:'bar',

data:{
labels:[
'Students',
'Exams',
'Questions',
'Results',
'Cheating'
],

datasets:[{
label:'System Data',

data:[
{{ total_students }},
{{ total_exams }},
{{ total_questions }},
{{ total_results }},
{{ cheating_cases }}
]
}]
}
}
);

</script>

</body>
</html>
