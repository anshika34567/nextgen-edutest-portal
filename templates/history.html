{% load static %}
<link rel="stylesheet" href="{% static 'css/style.css' %}">

<div class="main-container">

<div class="exam-box">

<h2>Your Exam History</h2>

<table border="1" width="100%" cellpadding="10">

<tr>
<th>Name</th>
<th>Score</th>
<th>Total</th>
<th>Date</th>
</tr>

{% for r in results %}

<tr>
<td>{{ r.student_name }}</td>
<td>{{ r.score }}</td>
<td>{{ r.total }}</td>
<td>{{ r.date }}</td>
</tr>

{% endfor %}

</table>

</div>

</div>
