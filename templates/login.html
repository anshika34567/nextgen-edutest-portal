<!DOCTYPE html>
<html lang="en">
<head>
    <title>Student Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

    body{
        margin:0;
        font-family:'Segoe UI',sans-serif;
        min-height:100vh;

        background:linear-gradient(
            135deg,
            #0f172a,
            #1e3a8a,
            #312e81
        );

        color:white;
    }

    .navbar{
        background:rgba(0,0,0,0.3)!important;
        backdrop-filter:blur(10px);
        padding:15px 30px;
    }

    .login-section{
        min-height:90vh;
        display:flex;
        justify-content:center;
        align-items:center;
    }

    .login-card{
        width:500px;

        background:rgba(255,255,255,0.1);

        backdrop-filter:blur(15px);

        border-radius:20px;

        padding:40px;

        box-shadow:0 8px 30px rgba(0,0,0,0.3);

        animation:fadeIn 0.8s ease;
    }

    .login-card h2{
        text-align:center;
        margin-bottom:10px;
        font-weight:700;
    }

    .form-control{
        padding:12px;
        border-radius:10px;
        border:none;
        margin-bottom:15px;
    }

    .btn-login{
        width:100%;
        background:#2563eb;
        border:none;
        padding:12px;
        border-radius:10px;
        color:white;
        font-size:18px;
    }

    .btn-login:hover{
        background:#1d4ed8;
    }

    .register-link{
        text-align:center;
        margin-top:20px;
    }

    .register-link a{
        color:#60a5fa;
        text-decoration:none;
    }

    .footer{
        text-align:center;
        color:#cbd5e1;
        padding:20px;
    }

    @keyframes fadeIn{
        from{
            opacity:0;
            transform:translateY(30px);
        }
        to{
            opacity:1;
            transform:translateY(0);
        }
    }

    </style>

</head>
<body>

<nav class="navbar navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold">
            🎓 EduTest Portal
        </a>
    </div>
</nav>

<section class="login-section">

    <div class="login-card">

        <div class="text-center mb-4">
            <h1>🎓</h1>
            <h2>Student Login</h2>
            <p style="color:#cbd5e1;">
                Access your EduTest account
            </p>
        </div>

        <form method="POST">

            {% csrf_token %}

            {% if error %}
            <div class="alert alert-danger">
                {{ error }}
            </div>
            {% endif %}

            <input type="email"
                   name="email"
                   class="form-control"
                   placeholder="Email Address"
                   required>

            <input type="password"
                   name="password"
                   class="form-control"
                   placeholder="Password"
                   required>

            <button type="submit" class="btn-login">
                Login
            </button>

        </form>

        <div class="register-link">
            New Student?
            <a href="/register/">Register Here</a>
        </div>

    </div>

</section>

<footer class="footer">
    © 2026 EduTest Portal | Final Year Project
</footer>

</body>
</html>
