<!DOCTYPE html>
<html>

<head>

<title>Result</title>

{% load static %}

<link rel="stylesheet" href="{% static 'css/style.css' %}">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand">NextGen EduTest Portal</a>
    </div>
</nav>
{% include 'navbar.html' %}
<div class="dashboard-box text-center">

<h2>Exam Result</h2>

<hr>

<h4>Your Score: {{ score }} / {{ total }}</h4>
<h4>Percentage: {{ percentage }}%</h4>


{% if score >= 5 %}
<p style="color:green;">Excellent Performance 🎉</p>
{% else %}
<p style="color:red;">Keep Practicing 📚</p>
{% endif %}

<a href="/dashboard" class="btn btn-primary mt-3">Back to Dashboard</a>

</div>
<div class="footer" style="text-align: center; position: fixed; bottom: 0; width: 100%; padding: 10px; background-color: #f8f9fa;">
NextGen EduTest Portal © 2026
</div>

</body>

</html>
